<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de E-sports - Rankings e Histórico</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0d1117; color: #c9d1d9; font-family: system-ui, -apple-system, sans-serif; }
    .bg-dark-card { background-color: #161b22; }
    .border-dark { border-color: #30363d; }
    .bg-dark-hover:hover { background-color: #21262d; }
  </style>
</head>
<body class="p-4 md:p-8">

  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Topo / Cabeçalho -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-dark">
      <div>
        <h1 class="text-2xl font-bold text-white flex items-center gap-2">
          <span>🏆</span> Central de Campeonatos & Rankings
        </h1>
        <p class="text-xs text-gray-400 mt-1" id="last-updated">Sincronizado com Google Sheets</p>
      </div>
      
      <!-- Navegação das Abas Principais -->
      <div class="flex items-center bg-dark-card border border-dark rounded-xl p-1 gap-1">
        <button id="nav-times" onclick="switchMainTab('times')" class="px-4 py-2 text-xs font-bold rounded-lg transition text-white bg-blue-600">
          Ranking Times
        </button>
        <button id="nav-historico" onclick="switchMainTab('historico')" class="px-4 py-2 text-xs font-bold rounded-lg transition text-gray-400 hover:text-white">
          Histórico de Competições
        </button>
        <button id="nav-jogadores" onclick="switchMainTab('jogadores')" class="px-4 py-2 text-xs font-bold rounded-lg transition text-gray-400 hover:text-white">
          Jogadores
        </button>
      </div>
    </div>

    <!-- PAINEL CONTEÚDO: RANKING TIMES -->
    <div id="section-times" class="space-y-4">
      <h2 class="text-lg font-bold text-white flex items-center gap-2">
        <span>🛡️</span> Ranking de Equipes (Geral + Regiões)
      </h2>
      <!-- Layout Grid (Sem Scroll Lateral) -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="container-times">
        <!-- Renderizado via JS -->
      </div>
    </div>

    <!-- PAINEL CONTEÚDO: HISTÓRICO DE COMPETIÇÕES -->
    <div id="section-historico" class="space-y-4 hidden">
      <h2 class="text-lg font-bold text-white flex items-center gap-2">
        <span>📜</span> Histórico de Campeonatos (Geral + Regiões)
      </h2>
      <!-- Layout Grid (Sem Scroll Lateral) -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="container-historico">
        <!-- Renderizado via JS -->
      </div>
    </div>

    <!-- PAINEL CONTEÚDO: JOGADORES -->
    <div id="section-jogadores" class="space-y-4 hidden">
      <h2 class="text-lg font-bold text-white flex items-center gap-2">
        <span>👤</span> Ranking de Jogadores por Títulos (Geral + Regiões)
      </h2>
      <!-- Layout Grid (Sem Scroll Lateral) -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="container-jogadores">
        <!-- Renderizado via JS -->
      </div>
    </div>

  </div>

  <script>
    /* =========================================================================
       CONFIGURAÇÃO DOS LINKS DAS ABAS DO GOOGLE SHEETS (CSV)
       Cole os seus links CSV entre as aspas simples ' '.
    ========================================================================= */
    const CSV_URL_TIMES = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT1Jhme0h-7ZEeSgPyb3jD6ZowZQOQmDr1LxVP8CP5T64v9XFIZFtAASAy5o7UhmK9NBYedr6PQyn9L/pub?gid=0&single=true&output=csv';     // Aba "Ranking Times"
    const CSV_URL_HISTORICO = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT1Jhme0h-7ZEeSgPyb3jD6ZowZQOQmDr1LxVP8CP5T64v9XFIZFtAASAy5o7UhmK9NBYedr6PQyn9L/pub?gid=195413319&single=true&output=csv'; // Aba "Histórico de Competições"
    const CSV_URL_JOGADORES = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT1Jhme0h-7ZEeSgPyb3jD6ZowZQOQmDr1LxVP8CP5T64v9XFIZFtAASAy5o7UhmK9NBYedr6PQyn9L/pub?gid=1601155160&single=true&output=csv'; // Aba "Jogadores"

    // -------------------------------------------------------------------------
    // DADOS DE DEMONSTRAÇÃO
    // -------------------------------------------------------------------------
    const DEMO_TIMES = [
      { name: 'Loud', logo: 'https://upload.wikimedia.org/wikipedia/commons/a/ab/Logo-Shield-Sample.svg', region: 'BR', tag: 'LLL', titles: 5 },
      { name: 'KRU', logo: '', region: 'LATAM', tag: 'B', titles: 3 },
      { name: 'LEV', logo: '', region: 'LATAM', tag: 'C', titles: 9 },
      { name: 'C9', logo: '', region: 'NA', tag: 'D', titles: 1 },
      { name: 'SEN', logo: '', region: 'NA', tag: 'E', titles: 4 },
      { name: 'F', logo: '', region: 'ES', tag: 'F', titles: 0 },
      { name: 'Fluxo', logo: 'https://upload.wikimedia.org/wikipedia/commons/a/ab/Logo-Shield-Sample.svg', region: 'BR', tag: 'FX', titles: 2 },
      { name: 'RED', logo: 'https://upload.wikimedia.org/wikipedia/commons/a/ab/Logo-Shield-Sample.svg', region: 'BR', tag: 'RED', titles: 6 }
    ];

    const DEMO_HISTORICO = [
      { region: 'BR', comp: 'LIGA BR', season: '2026.1', champion: 'LOUD', logo: 'https://upload.wikimedia.org/wikipedia/commons/a/ab/Logo-Shield-Sample.svg', tag: 'LLL' },
      { region: 'LATAM', comp: 'LIGA LATAM', season: '2026.1', champion: 'KRU', logo: '', tag: 'B' },
      { region: 'NA', comp: 'LIGA NA', season: '2026.1', champion: 'SEN', logo: '', tag: 'E' },
      { region: 'BR', comp: 'COPA BR', season: '2026', champion: 'FLUXO', logo: 'https://upload.wikimedia.org/wikipedia/commons/a/ab/Logo-Shield-Sample.svg', tag: 'FX' },
      { region: 'LATAM', comp: 'COPA LATAM', season: '2026', champion: 'KRU', logo: '', tag: 'B' },
      { region: 'NA', comp: 'COPA NA', season: '2026', champion: 'C9', logo: '', tag: 'D' },
      { region: 'BR', comp: 'LIGA BR', season: '2026.2', champion: 'LOUD', logo: 'https://upload.wikimedia.org/wikipedia/commons/a/ab/Logo-Shield-Sample.svg', tag: 'LLL' },
      { region: 'LATAM', comp: 'LIGA LATAM', season: '2026.2', champion: 'LEV', logo: '', tag: 'C' },
      { region: 'NA', comp: 'LIGA NA', season: '2026.2', champion: 'SEN', logo: '', tag: 'E' }
    ];

    const DEMO_JOGADORES = [
      { name: 'Couto', team: 'Loud', logo: 'https://upload.wikimedia.org/wikipedia/commons/a/ab/Logo-Shield-Sample.svg', titles: 5, mvps: 6, region: 'BR' },
      { name: 'Ray', team: 'Fluxo', logo: 'https://upload.wikimedia.org/wikipedia/commons/a/ab/Logo-Shield-Sample.svg', titles: 2, mvps: 2, region: 'NA' },
      { name: 'Naty', team: 'Red', logo: 'https://upload.wikimedia.org/wikipedia/commons/a/ab/Logo-Shield-Sample.svg', titles: 0, mvps: 0, region: 'LATAM' }
    ];

    let dataTimes = [];
    let dataHistorico = [];
    let dataJogadores = [];

    function parseCsvRows(text) {
      const rows = [];
      let curRow = [], curVal = '', inQuotes = false;
      const cleanText = text.replace(/\r/g, '');
      const firstLine = cleanText.split('\n')[0] || '';
      const delimiter = (firstLine.split(';').length > firstLine.split(',').length) ? ';' : ',';

      for (let i = 0; i < cleanText.length; i++) {
        const c = cleanText[i], next = cleanText[i+1];
        if (inQuotes && c === '"' && next === '"') { curVal += '"'; i++; }
        else if (c === '"') { inQuotes = !inQuotes; }
        else if (c === delimiter && !inQuotes) { curRow.push(curVal.trim()); curVal = ''; }
        else if (c === '\n' && !inQuotes) {
          curRow.push(curVal.trim());
          if (curRow.some(v => v.length > 0)) rows.push(curRow);
          curRow = []; curVal = '';
        } else curVal += c;
      }
      if (curVal.length > 0 || curRow.length > 0) { curRow.push(curVal.trim()); if (curRow.some(v => v.length > 0)) rows.push(curRow); }
      return rows;
    }

    function switchMainTab(tab) {
      const tabs = ['times', 'historico', 'jogadores'];
      tabs.forEach(t => {
        const btn = document.getElementById(`nav-${t}`);
        const section = document.getElementById(`section-${t}`);
        if (t === tab) {
          btn.className = "px-4 py-2 text-xs font-bold rounded-lg transition text-white bg-blue-600";
          section.classList.remove('hidden');
        } else {
          btn.className = "px-4 py-2 text-xs font-bold rounded-lg transition text-gray-400 hover:text-white";
          section.classList.add('hidden');
        }
      });
    }

    // -------------------------------------------------------------------------
    // RENDERIZAR RANKING TIMES
    // -------------------------------------------------------------------------
    function renderSectionTimes() {
      const container = document.getElementById('container-times');
      container.innerHTML = '';

      const sortedGeral = [...dataTimes].sort((a, b) => b.titles - a.titles);
      const regions = Array.from(new Set(dataTimes.map(t => t.region).filter(Boolean))).sort();

      const groups = [
        { title: 'Ranking Geral', teams: sortedGeral },
        ...regions.map(r => ({ title: `Ranking Região ${r}`, teams: dataTimes.filter(t => t.region === r).sort((a, b) => b.titles - a.titles) }))
      ];

      groups.forEach(group => {
        const card = document.createElement('div');
        card.className = "w-full bg-dark-card border border-dark rounded-xl overflow-hidden shadow-lg flex flex-col";
        
        let rowsHtml = group.teams.map((item, idx) => {
          let pos = `${idx + 1}º`;
          if (idx === 0) pos = '🥇'; else if (idx === 1) pos = '🥈'; else if (idx === 2) pos = '🥉';
          const logo = item.logo ? `<img src="${item.logo}" class="w-5 h-5 object-contain rounded" onerror="this.style.display='none'">` : '';

          return `
            <tr class="hover:bg-dark-hover/50">
              <td class="px-3 py-2 text-center font-bold text-xs">${pos}</td>
              <td class="px-3 py-2 font-semibold text-white text-xs">
                <div class="flex items-center gap-2">${logo}<span>${item.name}</span></div>
              </td>
              <td class="px-3 py-2 text-xs text-gray-400 font-mono">${item.tag || '-'}</td>
              <td class="px-3 py-2 text-xs text-gray-400">${item.region || '-'}</td>
              <td class="px-3 py-2 text-right font-bold text-yellow-400 text-xs">${item.titles}</td>
            </tr>
          `;
        }).join('');

        card.innerHTML = `
          <div class="bg-[#1f242d] px-4 py-3 border-b border-dark flex justify-between items-center">
            <h3 class="font-bold text-sm text-white">${group.title}</h3>
            <span class="text-[10px] bg-blue-500/20 text-blue-400 border border-blue-500/30 px-2 py-0.5 rounded-full font-semibold">${group.teams.length} times</span>
          </div>
          <div class="overflow-y-auto max-h-[480px]">
            <table class="w-full text-left">
              <thead class="bg-[#161b22] border-b border-dark text-gray-400 text-[11px] uppercase">
                <tr>
                  <th class="px-3 py-2 w-10 text-center">Pos</th>
                  <th class="px-3 py-2">Time</th>
                  <th class="px-3 py-2">TAG</th>
                  <th class="px-3 py-2">Região</th>
                  <th class="px-3 py-2 text-right">Títulos</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-dark text-gray-200">${rowsHtml || '<tr><td colspan="5" class="p-4 text-center text-xs text-gray-500">Sem dados</td></tr>'}</tbody>
            </table>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // -------------------------------------------------------------------------
    // RENDERIZAR HISTÓRICO DE COMPETIÇÕES
    // -------------------------------------------------------------------------
    function renderSectionHistorico() {
      const container = document.getElementById('container-historico');
      container.innerHTML = '';

      const regions = Array.from(new Set(dataHistorico.map(h => h.region).filter(Boolean))).sort();

      const groups = [
        { title: 'Geral', list: dataHistorico },
        ...regions.map(r => ({ title: `Região ${r}`, list: dataHistorico.filter(h => h.region === r) }))
      ];

      groups.forEach(group => {
        const card = document.createElement('div');
        card.className = "w-full bg-dark-card border border-dark rounded-xl overflow-hidden shadow-lg flex flex-col";

        let rowsHtml = group.list.map((item) => {
          const logo = item.logo ? `<img src="${item.logo}" class="w-4 h-4 object-contain rounded" onerror="this.style.display='none'">` : '';
          return `
            <tr class="hover:bg-dark-hover/50">
              <td class="px-3 py-2 font-semibold text-white text-xs">${item.comp}</td>
              <td class="px-3 py-2 text-xs text-blue-400 font-mono">${item.season}</td>
              <td class="px-3 py-2 text-xs font-bold text-yellow-400">
                <div class="flex items-center gap-1.5">${logo}<span>${item.champion}</span></div>
              </td>
              <td class="px-3 py-2 text-xs text-gray-400 font-mono">${item.tag || '-'}</td>
            </tr>
          `;
        }).join('');

        card.innerHTML = `
          <div class="bg-[#1f242d] px-4 py-3 border-b border-dark flex justify-between items-center">
            <h3 class="font-bold text-sm text-white">${group.title}</h3>
            <span class="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full font-semibold">${group.list.length} torneios</span>
          </div>
          <div class="overflow-y-auto max-h-[480px]">
            <table class="w-full text-left">
              <thead class="bg-[#161b22] border-b border-dark text-gray-400 text-[11px] uppercase">
                <tr>
                  <th class="px-3 py-2">Competição</th>
                  <th class="px-3 py-2">Temp.</th>
                  <th class="px-3 py-2">Campeão</th>
                  <th class="px-3 py-2">TAG</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-dark text-gray-200">${rowsHtml || '<tr><td colspan="4" class="p-4 text-center text-xs text-gray-500">Sem dados</td></tr>'}</tbody>
            </table>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // -------------------------------------------------------------------------
    // RENDERIZAR JOGADORES
    // -------------------------------------------------------------------------
    function renderSectionJogadores() {
      const container = document.getElementById('container-jogadores');
      container.innerHTML = '';

      const sortedGeral = [...dataJogadores].sort((a, b) => b.titles - a.titles || b.mvps - a.mvps);
      const regions = Array.from(new Set(dataJogadores.map(j => j.region).filter(Boolean))).sort();

      const groups = [
        { title: 'Ranking Geral', players: sortedGeral },
        ...regions.map(r => ({ title: `Ranking Região ${r}`, players: dataJogadores.filter(j => j.region === r).sort((a, b) => b.titles - a.titles || b.mvps - a.mvps) }))
      ];

      groups.forEach(group => {
        const card = document.createElement('div');
        card.className = "w-full bg-dark-card border border-dark rounded-xl overflow-hidden shadow-lg flex flex-col";

        let rowsHtml = group.players.map((item, idx) => {
          let pos = `${idx + 1}º`;
          if (idx === 0) pos = '🥇'; else if (idx === 1) pos = '🥈'; else if (idx === 2) pos = '🥉';
          const logo = item.logo ? `<img src="${item.logo}" class="w-4 h-4 object-contain rounded" onerror="this.style.display='none'">` : '';

          return `
            <tr class="hover:bg-dark-hover/50">
              <td class="px-3 py-2 text-center font-bold text-xs">${pos}</td>
              <td class="px-3 py-2 font-bold text-white text-xs">${item.name}</td>
              <td class="px-3 py-2 font-semibold text-xs text-gray-300">
                <div class="flex items-center gap-1.5">${logo}<span>${item.team}</span></div>
              </td>
              <td class="px-3 py-2 text-right font-bold text-yellow-400 text-xs">${item.titles}</td>
              <td class="px-3 py-2 text-right font-bold text-purple-400 text-xs">${item.mvps}</td>
            </tr>
          `;
        }).join('');

        card.innerHTML = `
          <div class="bg-[#1f242d] px-4 py-3 border-b border-dark flex justify-between items-center">
            <h3 class="font-bold text-sm text-white">${group.title}</h3>
            <span class="text-[10px] bg-purple-500/20 text-purple-400 border border-purple-500/30 px-2 py-0.5 rounded-full font-semibold">${group.players.length} jogadores</span>
          </div>
          <div class="overflow-y-auto max-h-[480px]">
            <table class="w-full text-left">
              <thead class="bg-[#161b22] border-b border-dark text-gray-400 text-[11px] uppercase">
                <tr>
                  <th class="px-3 py-2 w-10 text-center">Pos</th>
                  <th class="px-3 py-2">Jogador</th>
                  <th class="px-3 py-2">Time Atual</th>
                  <th class="px-3 py-2 text-right">Títulos</th>
                  <th class="px-3 py-2 text-right">MVPs</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-dark text-gray-200">${rowsHtml || '<tr><td colspan="5" class="p-4 text-center text-xs text-gray-500">Sem dados</td></tr>'}</tbody>
            </table>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // -------------------------------------------------------------------------
    // CARREGAMENTO E PARSERS COM FILTROS DE CABEÇALHO/TÍTULO
    // -------------------------------------------------------------------------
    async function fetchCsvData(url, defaultData, parseFn) {
      if (!url || url.includes('COLE_SEU_LINK')) return defaultData;
      let cleanUrl = url;
      if (cleanUrl.includes('/pubhtml')) cleanUrl = cleanUrl.replace('/pubhtml', '/pub?output=csv');
      if (cleanUrl.includes('/edit')) cleanUrl = cleanUrl.replace(/\/edit.*$/, '/export?format=csv');
      cleanUrl += (cleanUrl.includes('?') ? '&' : '?') + 't=' + new Date().getTime();

      try {
        const res = await fetch(cleanUrl);
        const text = await res.text();
        if (text.includes('<!DOCTYPE') || text.includes('<html')) return defaultData;
        return parseFn(text);
      } catch (e) {
        console.error('Erro ao carregar CSV:', e);
        return defaultData;
      }
    }

    function parseTimesCsv(csvText) {
      const rows = parseCsvRows(csvText);
      const invalidNames = ['ranking geral', 'time', 'equipe', 'clube', 'nome', 'team'];

      return rows.map(r => ({
        name: r[0] || '',
        logo: r[1] || '',
        region: (r[2] || '').toUpperCase(),
        tag: (r[3] || '').toUpperCase(),
        titles: parseInt(r[4] || '0', 10) || 0
      })).filter(t => {
        if (!t.name) return false;
        const norm = t.name.toLowerCase().trim();
        return !invalidNames.includes(norm);
      });
    }

    function parseHistoricoCsv(csvText) {
      const rows = parseCsvRows(csvText);
      const invalidWords = ['região', 'regiao', 'geral', 'competição', 'competicao'];

      return rows.map(r => ({
        region: (r[0] || '').toUpperCase(),
        comp: r[1] || '',
        season: r[2] || '',
        champion: r[3] || '',
        logo: r[4] || '',
        tag: (r[5] || '').toUpperCase()
      })).filter(h => {
        if (!h.comp && !h.champion) return false;
        const normComp = (h.comp || '').toLowerCase().trim();
        const normReg = (h.region || '').toLowerCase().trim();
        return !invalidWords.includes(normComp) && !invalidWords.includes(normReg);
      });
    }

    function parseJogadoresCsv(csvText) {
      const rows = parseCsvRows(csvText);
      const invalidNames = ['jogador', 'nome', 'player', 'time atual'];

      return rows.map(r => ({
        name: r[0] || '',
        team: r[1] || '',
        logo: r[2] || '',
        titles: parseInt(r[3] || '0', 10) || 0,
        mvps: parseInt(r[4] || '0', 10) || 0,
        region: (r[5] || '').toUpperCase()
      })).filter(j => {
        if (!j.name) return false;
        const norm = j.name.toLowerCase().trim();
        return !invalidNames.includes(norm);
      });
    }

    async function init() {
      dataTimes = await fetchCsvData(CSV_URL_TIMES, DEMO_TIMES, parseTimesCsv);
      dataHistorico = await fetchCsvData(CSV_URL_HISTORICO, DEMO_HISTORICO, parseHistoricoCsv);
      dataJogadores = await fetchCsvData(CSV_URL_JOGADORES, DEMO_JOGADORES, parseJogadoresCsv);

      document.getElementById('last-updated').textContent = `Última sincronização: ${new Date().toLocaleTimeString('pt-BR')}`;

      renderSectionTimes();
      renderSectionHistorico();
      renderSectionJogadores();
    }

    init();
  </script>
</body>
</html>
