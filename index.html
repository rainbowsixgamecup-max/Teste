<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking de Títulos por Equipe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0d1117; color: #c9d1d9; font-family: system-ui, -apple-system, sans-serif; }
    .bg-dark-card { background-color: #161b22; }
    .border-dark { border-color: #30363d; }
    .bg-dark-hover:hover { background-color: #21262d; }
  </style>
</head>
<body class="p-4 md:p-8">

  <div class="max-w-6xl mx-auto space-y-8">
    
    <!-- Cabeçalho -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-dark">
      <div>
        <h1 class="text-2xl font-bold text-white flex items-center gap-2">
          <span>🏆</span> Ranking de Títulos por Equipe
        </h1>
        <p class="text-xs text-gray-400 mt-1" id="last-updated">Sincronizado com Google Sheets</p>
      </div>
      <div class="flex items-center gap-2">
        <input type="text" id="search-input" placeholder="Buscar por equipe ou TAG..." 
               class="bg-dark-card border border-dark rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:border-blue-500 w-full md:w-64">
      </div>
    </div>

    <!-- Painel de Estatísticas -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-dark-card border border-dark rounded-xl p-4">
        <span class="text-xs text-gray-400 uppercase font-semibold">Total de Equipes</span>
        <div class="text-2xl font-bold text-white mt-1" id="stat-total-teams">0</div>
      </div>
      <div class="bg-dark-card border border-dark rounded-xl p-4">
        <span class="text-xs text-gray-400 uppercase font-semibold">Total de Títulos</span>
        <div class="text-2xl font-bold text-yellow-400 mt-1" id="stat-total-titles">0</div>
      </div>
      <div class="bg-dark-card border border-dark rounded-xl p-4">
        <span class="text-xs text-gray-400 uppercase font-semibold">Regiões Ativas</span>
        <div class="text-2xl font-bold text-blue-400 mt-1" id="stat-total-regions">0</div>
      </div>
      <div class="bg-dark-card border border-dark rounded-xl p-4">
        <span class="text-xs text-gray-400 uppercase font-semibold">Líder do Ranking</span>
        <div class="text-2xl font-bold text-emerald-400 truncate mt-1" id="stat-top-team">-</div>
      </div>
    </div>

    <!-- SEÇÃO 1: RANKING GERAL -->
    <div class="space-y-3">
      <h2 class="text-xl font-bold text-white flex items-center gap-2">
        <span>🌐</span> Ranking Geral
      </h2>
      <div class="bg-dark-card border border-dark rounded-xl overflow-hidden shadow-xl">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-[#161b22] border-b border-dark text-gray-400 text-xs uppercase font-semibold">
              <tr>
                <th class="px-4 py-3.5 w-16 text-center">Pos</th>
                <th class="px-4 py-3.5">Equipe</th>
                <th class="px-4 py-3.5 w-24">TAG</th>
                <th class="px-4 py-3.5 w-28">Região</th>
                <th class="px-4 py-3.5 w-28 text-right">Títulos</th>
              </tr>
            </thead>
            <tbody id="geral-tbody" class="divide-y divide-dark text-gray-200"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- SEÇÃO 2: RANKINGS POR REGIÃO -->
    <div class="space-y-6" id="regions-container">
      <!-- Tabelas regionais geradas via JS -->
    </div>

  </div>

  <script>
    // Cole seu link CSV publicado do Google Sheets abaixo
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT1Jhme0h-7ZEeSgPyb3jD6ZowZQOQmDr1LxVP8CP5T64v9XFIZFtAASAy5o7UhmK9NBYedr6PQyn9L/pub?output=csv';

    let rawTeamsData = [];
    let searchQuery = '';

    const DEMO_DATA = [
      { name: 'Equipe A', logo: 'https://upload.wikimedia.org/wikipedia/commons/a/ab/Logo-Shield-Sample.svg', region: 'SP', tag: 'TAG-A', titles: 5 },
      { name: 'Equipe B', logo: '', region: 'MG', tag: 'TAG-B', titles: 3 },
      { name: 'Equipe C', logo: '', region: 'RJ', tag: 'TAG-C', titles: 9 },
      { name: 'Equipe D', logo: '', region: 'SP', tag: 'TAG-D', titles: 1 },
      { name: 'Equipe E', logo: '', region: 'MG', tag: 'TAG-E', titles: 4 },
      { name: 'Equipe F', logo: '', region: 'ES', tag: 'TAG-F', titles: 0 }
    ];

    function parseFullCsv(csvText) {
      const rows = [];
      let curRow = [];
      let curVal = '';
      let inQuotes = false;
      const text = csvText.replace(/\r/g, '');
      const firstLine = text.split('\n')[0] || '';
      const delimiter = (firstLine.split(';').length > firstLine.split(',').length) ? ';' : ',';

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i+1];
        if (inQuotes && c === '"' && next === '"') { curVal += '"'; i++; }
        else if (c === '"') { inQuotes = !inQuotes; }
        else if (c === delimiter && !inQuotes) { curRow.push(curVal.trim()); curVal = ''; }
        else if (c === '\n' && !inQuotes) {
          curRow.push(curVal.trim());
          if (curRow.some(v => v.length > 0)) rows.push(curRow);
          curRow = []; curVal = '';
        } else { curVal += c; }
      }
      if (curVal.length > 0 || curRow.length > 0) { curRow.push(curVal.trim()); if (curRow.some(v => v.length > 0)) rows.push(curRow); }
      return rows;
    }

    function parseCsv(csvText) {
      if (!csvText || !csvText.trim()) return DEMO_DATA;
      const rows = parseFullCsv(csvText);
      if (rows.length === 0) return DEMO_DATA;

      const headerKeywords = ['time', 'equipe', 'nome', 'clube', 'team', 'logo', 'link', 'regiao', 'uf', 'estado', 'tag', 'titulo', 'titulos'];
      const firstRow = rows[0];
      const hasHeader = firstRow.some(col => headerKeywords.some(k => col.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").includes(k)));
      
      let nameIdx = 0, logoIdx = 1, regionIdx = 2, tagIdx = 3, titlesIdx = 4;
      const dataRows = hasHeader ? rows.slice(1) : rows;

      if (hasHeader) {
        const findIdx = (keywords) => firstRow.findIndex(h => keywords.some(k => h.toLowerCase().includes(k)));
        const nIdx = findIdx(['time', 'equipe', 'nome', 'clube', 'team']);
        const lIdx = findIdx(['logo', 'link', 'img', 'imagem']);
        const rIdx = findIdx(['regiao', 'uf', 'estado']);
        const tgIdx = findIdx(['tag']);
        const tIdx = findIdx(['titulo', 'titulos', 'vitoria', 'ponto', 'pts']);
        
        if (nIdx !== -1) nameIdx = nIdx;
        if (lIdx !== -1) logoIdx = lIdx;
        if (rIdx !== -1) regionIdx = rIdx;
        if (tgIdx !== -1) tagIdx = tgIdx;
        if (tIdx !== -1) titlesIdx = tIdx;
      }

      return dataRows.map(cols => {
        const cleanStr = (idx) => (cols[idx] !== undefined ? cols[idx].trim() : '');
        let name = cleanStr(nameIdx);
        if (!name) name = cols.find(c => c && !c.startsWith('http') && isNaN(c) && c.trim().length > 0) || '';
        const logo = cleanStr(logoIdx);
        const region = cleanStr(regionIdx).toUpperCase();
        const tag = cleanStr(tagIdx).toUpperCase();
        const titles = parseInt(cleanStr(titlesIdx), 10) || 0;
        return { name, logo, region, tag, titles };
      }).filter(t => t.name.length > 0);
    }

    function updateUI() {
      rawTeamsData.sort((a, b) => b.titles - a.titles);
      document.getElementById('last-updated').textContent = `Última verificação: ${new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
      renderStats();
      renderAllTables();
    }

    function renderStats() {
      document.getElementById('stat-total-teams').textContent = rawTeamsData.length;
      document.getElementById('stat-total-titles').textContent = rawTeamsData.reduce((s, t) => s + t.titles, 0);
      const regionsSet = new Set(rawTeamsData.map(t => t.region).filter(Boolean));
      document.getElementById('stat-total-regions').textContent = regionsSet.size;
      document.getElementById('stat-top-team').textContent = rawTeamsData.length > 0 ? rawTeamsData[0].name : '-';
    }

    function buildTableRows(teams) {
      return teams.map((team, index) => {
        let posBadge = `${index + 1}º`;
        if (index === 0) posBadge = '🥇';
        else if (index === 1) posBadge = '🥈';
        else if (index === 2) posBadge = '🥉';

        const logoHtml = team.logo 
          ? `<img src="${team.logo}" class="w-6 h-6 object-contain rounded" alt="" onerror="this.style.display='none'">` 
          : `<div class="w-6 h-6 rounded bg-gray-700 flex items-center justify-center text-[10px] font-bold text-gray-300">${team.tag || 'T'}</div>`;

        return `
          <tr class="hover:bg-dark-hover/50 transition duration-150">
            <td class="px-4 py-3 text-center font-bold text-base">${posBadge}</td>
            <td class="px-4 py-3 font-semibold text-white">
              <div class="flex items-center space-x-3">
                ${logoHtml}
                <span>${team.name}</span>
              </div>
            </td>
            <td class="px-4 py-3"><span class="bg-gray-800 border border-dark text-gray-300 text-xs px-2 py-0.5 rounded font-mono">${team.tag || '-'}</span></td>
            <td class="px-4 py-3"><span class="text-xs text-gray-400 font-medium">${team.region || '-'}</span></td>
            <td class="px-4 py-3 text-right font-bold text-base text-yellow-400">${team.titles}</td>
          </tr>
        `;
      }).join('');
    }

    function renderAllTables() {
      let data = [...rawTeamsData];
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        data = data.filter(t => t.name.toLowerCase().includes(q) || t.tag.toLowerCase().includes(q));
      }

      // Ranking Geral
      const geralTbody = document.getElementById('geral-tbody');
      if (data.length === 0) {
        geralTbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-400">Nenhuma equipe encontrada.</td></tr>`;
      } else {
        geralTbody.innerHTML = buildTableRows(data);
      }

      // Rankings por Região
      const regionsContainer = document.getElementById('regions-container');
      regionsContainer.innerHTML = '';

      const regions = Array.from(new Set(rawTeamsData.map(t => t.region).filter(Boolean))).sort();

      regions.forEach(region => {
        const regionTeams = data.filter(t => t.region === region);
        if (searchQuery && regionTeams.length === 0) return;

        const regionSection = document.createElement('div');
        regionSection.className = 'space-y-3';
        regionSection.innerHTML = `
          <div class="flex items-center justify-between">
            <h2 class="text-lg font-bold text-white flex items-center gap-2">
              <span>📍</span> Ranking Região ${region}
            </h2>
            <span class="text-xs bg-blue-600/20 text-blue-400 border border-blue-500/30 px-2 py-0.5 rounded-full font-semibold">
              ${regionTeams.length} equipes
            </span>
          </div>
          <div class="bg-dark-card border border-dark rounded-xl overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
              <table class="w-full text-left text-sm">
                <thead class="bg-[#161b22] border-b border-dark text-gray-400 text-xs uppercase font-semibold">
                  <tr>
                    <th class="px-4 py-3.5 w-16 text-center">Pos</th>
                    <th class="px-4 py-3.5">Equipe</th>
                    <th class="px-4 py-3.5 w-24">TAG</th>
                    <th class="px-4 py-3.5 w-28">Região</th>
                    <th class="px-4 py-3.5 w-28 text-right">Títulos</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-dark text-gray-200">
                  ${regionTeams.length > 0 ? buildTableRows(regionTeams) : `<tr><td colspan="5" class="p-6 text-center text-gray-400">Nenhuma equipe nesta região.</td></tr>`}
                </tbody>
              </table>
            </div>
          </div>
        `;
        regionsContainer.appendChild(regionSection);
      });
    }

    function init() {
      document.getElementById('search-input').addEventListener('input', (e) => {
        searchQuery = e.target.value.trim();
        renderAllTables();
      });

      if (!CSV_URL || CSV_URL.includes('COLE_SEU_LINK')) {
        rawTeamsData = DEMO_DATA;
        updateUI();
        return;
      }

      let fetchUrl = CSV_URL;
      if (fetchUrl.includes('/pubhtml')) fetchUrl = fetchUrl.replace('/pubhtml', '/pub?output=csv');
      if (fetchUrl.includes('/edit')) fetchUrl = fetchUrl.replace(/\/edit.*$/, '/export?format=csv');
      fetchUrl += (fetchUrl.includes('?') ? '&' : '?') + 't=' + new Date().getTime();

      fetch(fetchUrl)
        .then(res => res.text())
        .then(csvText => {
          rawTeamsData = parseCsv(csvText);
          updateUI();
        })
        .catch(err => {
          console.error('Erro ao carregar CSV:', err);
          rawTeamsData = DEMO_DATA;
          updateUI();
        });
    }

    init();
  </script>
</body>
</html>
