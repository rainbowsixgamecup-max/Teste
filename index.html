<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking de Títulos</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --accent-color: #58a6ff;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 24px;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; font-size: 1.8rem; }
    
    .nav-tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; overflow-x: auto; }
    .tab-btn {
      background: none; border: none; color: var(--text-muted); padding: 10px 16px;
      font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent;
    }
    .tab-btn.active { color: var(--accent-color); border-bottom-color: var(--accent-color); }

    table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 6px; overflow: hidden; border: 1px solid var(--border-color); }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border-color); }
    th { background: #21262d; font-weight: 600; color: var(--text-main); }
    tr:last-child td { border-bottom: none; }
    
    .team-logo { width: 24px; height: 24px; object-fit: contain; vertical-align: middle; margin-right: 8px; }
    .tag-badge { background: #21262d; border: 1px solid var(--border-color); padding: 2px 6px; border-radius: 4px; font-size: 0.85em; }
    .alert-box { background: #381e1e; border: 1px solid #f85149; color: #ff7b72; padding: 16px; border-radius: 6px; margin-bottom: 20px; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏆 Ranking de Títulos por Equipa</h1>
    
    <div id="error-alert" class="alert-box"></div>

    <div class="nav-tabs" id="tabs-container">
      <button class="tab-btn active" onclick="switchTab('Geral')">Geral</button>
    </div>

    <table id="ranking-table">
      <thead>
        <tr>
          <th>Posição</th>
          <th>Equipa</th>
          <th>TAG</th>
          <th>Região</th>
          <th>Títulos</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <script>
    // Cole aqui o seu link publicado em CSV
    let CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT1Jhme0h-7ZEeSgPyb3jD6ZowZQOQmDr1LxVP8CP5T64v9XFIZFtAASAy5o7UhmK9NBYedr6PQyn9L/pub?output=csv';

    let allTeamsData = [];
    let currentTab = 'Geral';

    function formatCsvUrl(url) {
      if (!url) return '';
      if (url.includes('/pubhtml')) return url.replace('/pubhtml', '/pub?output=csv');
      if (url.includes('/edit')) return url.replace(/\/edit.*$/, '/export?format=csv');
      return url;
    }

    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      if (lines.length === 0) return [];

      const rows = lines.map(line => {
        const matches = [];
        let match;
        const regex = /(?:^|,)("(?:[^"]|"")*"|[^,]*)/g;
        while ((match = regex.exec(line)) !== null) {
          let val = match[1].replace(/^"|"$/g, '').replace(/""/g, '"').trim();
          matches.push(val);
        }
        return matches;
      });

      // Se a primeira linha contiver nomes de colunas, remove o cabeçalho
      const isHeader = rows[0][0].toLowerCase().includes('time') || rows[0][0].toLowerCase().includes('equipa');
      const dataRows = isHeader ? rows.slice(1) : rows;

      return dataRows.map(row => ({
        name: row[0] || '',
        logo: row[1] || '',
        region: row[2] || '',
        tag: row[3] || '',
        titles: parseInt(row[4] || '0', 10) || 0
      }));
    }

    function showError(msg) {
      const box = document.getElementById('error-alert');
      box.innerHTML = msg;
      box.style.display = 'block';
    }

    function loadData() {
      const cleanUrl = formatCsvUrl(CSV_URL);
      if (!cleanUrl || cleanUrl.includes('COLE_SEU_LINK')) {
        showError('⚠️ Configure o link do seu Google Sheets publicado em CSV na variável CSV_URL.');
        return;
      }

      const fetchUrl = cleanUrl + (cleanUrl.includes('?') ? '&' : '?') + 't=' + new Date().getTime();

      fetch(fetchUrl)
        .then(res => res.text())
        .then(text => {
          // Validação para impedir a leitura de ficheiros HTML/JS
          if (text.includes('<!DOCTYPE') || text.includes('<html') || text.includes('var n=')) {
            showError('<strong>Erro no formato da Planilha:</strong> O link fornecido retornou uma página HTML/JS em vez de um CSV.<br>No Google Sheets, certifique-se de escolher <strong>Valores separados por vírgulas (.csv)</strong> ao publicar.');
            return;
          }

          document.getElementById('error-alert').style.display = 'none';
          allTeamsData = parseCSV(text);
          renderTabs();
          renderTable();
        })
        .catch(err => {
          showError('Erro ao carregar dados do Google Sheets: ' + err.message);
        });
    }

    function renderTabs() {
      const regions = [...new Set(allTeamsData.map(t => t.region).filter(Boolean))].sort();
      const container = document.getElementById('tabs-container');
      
      let html = `<button class="tab-btn ${currentTab === 'Geral' ? 'active' : ''}" onclick="switchTab('Geral')">Geral</button>`;
      regions.forEach(reg => {
        html += `<button class="tab-btn ${currentTab === reg ? 'active' : ''}" onclick="switchTab('${reg}')">${reg}</button>`;
      });
      container.innerHTML = html;
    }

    function switchTab(tab) {
      currentTab = tab;
      renderTabs();
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      let filtered = currentTab === 'Geral' 
        ? [...allTeamsData] 
        : allTeamsData.filter(t => t.region === currentTab);

      filtered.sort((a, b) => b.titles - a.titles);

      filtered.forEach((item, idx) => {
        const tr = document.createElement('tr');
        const logoHtml = item.logo ? `<img src="${item.logo}" class="team-logo" alt="">` : '';
        tr.innerHTML = `
          <td>${idx + 1}º</td>
          <td>${logoHtml}${item.name}</td>
          <td><span class="tag-badge">${item.tag}</span></td>
          <td>${item.region}</td>
          <td><strong>${item.titles}</strong></td>
        `;
        tbody.appendChild(tr);
      });
    }

    loadData();
  </script>
</body>
</html>
